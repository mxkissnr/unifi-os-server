name: Release on merged UOS update PR

on:
  pull_request:
    types: [closed]
  workflow_dispatch: {}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'uos-update'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Extract version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP 'ARG UOS_SERVER_VERSION="\K[^"]+' Dockerfile | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
        # The image build/push itself happens in build-image.yaml, triggered
        # by the "release: published" event this step fires. Do not duplicate
        # the docker build here — see .github/workflows/build-image.yaml.
